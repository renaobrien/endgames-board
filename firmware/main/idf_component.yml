  espressif/esp_lvgl_port: "~2.6.0"
  espressif/esp_lcd_touch_gt911: "^1.1.3"
  # Wi-Fi through the onboard ESP32-C6 (ESP-Hosted over SDIO). Pinned to the exact host version in Elecrow's working Wi-Fi sample (Lesson17).
